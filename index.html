<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nachhaltigkeits-Assessment</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #FCF6DE;
            color: #333;
        }
        header {
            background-color: #ADCA78;
            padding: 1rem;
            text-align: center;
            font-size: 1.5rem;
            color: #fff;
        }
        .container {
            max-width: 600px;
            margin: 2rem auto;
            background-color: #fff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        .fade {
            opacity: 0;
            transform: translateX(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .fade.show {
            opacity: 1;
            transform: translateX(0);
        }
        h2 {
            color: #ADCA78;
            margin-top: 0;
        }
        .question {
            margin: 1.5rem 0;
            font-size: 1.2rem;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .options label {
            background-color: #F3EED3;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .options input {
            margin-right: 0.5rem;
        }
        .options label:hover {
            background-color: #E8DFC3;
        }
        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
        }
        button {
            background-color: #ADCA78;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 5px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #99B86B;
        }
        button:disabled {
            background-color: #d2d9b6;
            cursor: not-allowed;
        }
        .result {
            text-align: center;
            padding: 2rem;
        }
        .score-display {
            font-size: 2rem;
            margin: 1rem 0;
            font-weight: bold;
        }
        .gauge {
            width: 200px;
            height: 100px;
            background: linear-gradient(to right, red, orange, yellow, lightgreen, green);
            border-radius: 100px 100px 0 0;
            margin: 2rem auto;
            position: relative;
            overflow: hidden;
        }
        .needle {
            width: 4px;
            height: 100px;
            background-color: #333;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform-origin: bottom;
            transform: rotate(0deg);
            transition: transform 1s ease;
        }
        @media (max-width: 600px) {
            .container {
                margin: 1rem;
                padding: 1.5rem;
            }
            .navigation {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
<header>Nachhaltigkeits-Assessment</header>
<div class="container fade show" id="form-container">
    <h2 id="section-title"></h2>
    <div class="question" id="question-text"></div>
    <div class="options" id="options">
        <label><input type="radio" name="answer" value="1"> Ja</label>
        <label><input type="radio" name="answer" value="-1"> Nein</label>
        <label><input type="radio" name="answer" value="0"> Keine Aussage</label>
    </div>
    <div class="navigation">
        <button id="prev-btn">Zurück</button>
        <button id="next-btn">Weiter</button>
    </div>
</div>
<div class="container fade" id="result-container" style="display: none;">
    <div class="result">
        <h2>Ergebnis</h2>
        <div class="score-display" id="score-text"></div>
        <div class="gauge">
            <div class="needle" id="needle"></div>
        </div>
    </div>
</div>
<script>
    const questions = [
        { section: 'ÖKOLOGIE', text: 'Es werden keine Tierversuche durgeführt.' },
        { section: 'ÖKOLOGIE', text: 'Werden nachwachsende Rohstoffe verwendet?' },
        { section: 'ÖKOLOGIE', text: 'Das Produkt verursacht keine Bodendegradierung.' },
        { section: 'ÖKOLOGIE', text: 'Das Produkt führt zu keiner regionalen Austrocknung.' },
        { section: 'ÖKOLOGIE', text: 'Das Produkt verursacht keine Umweltbelastung während der Nutzungsphase.' },
        { section: 'ÖKOLOGIE', text: 'Die Herstellung des Produkts trägt nicht zur Luftverschmutzung bei.' },
        { section: 'ÖKOLOGIE', text: 'Es werden keine giftigen oder gefährlichen Stoffe über Wasser verbreitet.' },
        { section: 'ÖKOLOGIE', text: 'Das Abwasser wird nicht in Gewässer eingeleitet.' },
        { section: 'ÖKOLOGIE', text: 'Ist der Abfall biologisch abbaubar?' },
        { section: 'ÖKOLOGIE', text: 'Werden ernsthafte Maßnahmen zur Reduzierung der allgemeinen Umweltbelastung getroffen?' },
        { section: 'ÖKOLOGIE', text: 'Stammt das Produkt aus ökologischem Anbau?' },
        { section: 'ÖKOLOGIE', text: 'Das Unternehmen beteiligt sich nicht an der Abholzung von Wäldern.' },
        { section: 'ÖKOLOGIE', text: 'Das Produkt beeinträchtigt die biologische Vielfalt nicht.' },
        { section: 'ÖKOLOGIE', text: 'Besteht die Verpackung aus recycelten oder wiederverwendeten Materialien oder kann sie anderweitig genutzt werden, statt weggeworfen zu werden?' },
        { section: 'ÖKOLOGIE', text: 'Ist die Lieferkette optimiert, um Transportwege zu verkürzen?' },
        { section: 'SOZIALES', text: 'Werden entlang der gesamten Lieferkette existenzsichernde Löhne gezahlt?' },
        { section: 'SOZIALES', text: 'Werden alle Mitarbeitenden gleich entlohnt – unabhängig von Geschlecht, Alter oder Herkunft?' },
        { section: 'SOZIALES', text: 'Es kommt entlang der Lieferkette zu keiner Kinderarbeit.' },
        { section: 'SOZIALES', text: 'Es gab in der Vergangenheit keine dokumentierten Fälle von Kinderarbeit entlang der Lieferkette.' },
        { section: 'SOZIALES', text: 'Erfahren Mitarbeitende bei psychischen und physischen Problemen Unterstützung durch das Unternehmen?' },
        { section: 'SOZIALES', text: 'Werden Beschäftigte in Entscheidungen einbezogen (z. B. über Betriebsräte)?' },
        { section: 'SOZIALES', text: 'Gibt es eine Serviceanlaufstelle für Konsument*innen?' },
        { section: 'SOZIALES', text: 'Werden sichere Arbeitsbedingungen entlang der gesamten Lieferkette gewährleistet?' },
        { section: 'SOZIALES', text: 'Sind Gewerkschaften erlaubt und steht es den Mitarbeitenden frei, sich in diesen zu engagieren und beizutreten?' },
        { section: 'SOZIALES', text: 'Gibt es eine Richtlinie zur Achtung der Menschenrechte?' },
        { section: 'SOZIALES', text: 'Gibt es entlang der Lieferkette einen Kündigungsschutz für Arbeitnehmer*innen?' },
        { section: 'SOZIALES', text: 'Gibt es entlang der Lieferkette verhältnismäßige Arbeitsbedingungen im Bezug auf Maximalarbeitszeit und Überstunden?' },
        { section: 'SOZIALES', text: 'Kam es in der Vergangenheit zu Menschenrechtsverletzungen im Umgang mit Mitarbeitenden?' },
        { section: 'SOZIALES', text: 'Gibt es entlang der Lieferkette faire arbeitsrechtliche Bestimmungen (Urlaub, Krankheit, Mutterschutz etc.)?' },
        { section: 'SOZIALES', text: 'Besteht eine interne Beschwerdestelle für Menschenrechtsverletzungen sowie Diskriminierung?' },
        { section: 'SOZIALES', text: 'Werden in Produktionsländern lokale Initiativen und Bewegungen einbezogen?' },
        { section: 'ÖKONOMIE', text: 'Informiert und sensibilisiert das Unternehmen ihre Kund*innen zu Umweltthemen?' },
        { section: 'ÖKONOMIE', text: 'Werden die unterschiedlichen Etappen der Lieferkette so gewählt, dass möglichst nachhaltig und effizient produziert werden kann?' },
        { section: 'ÖKONOMIE', text: 'Es wird kein Greenwashing betrieben.' },
        { section: 'ÖKONOMIE', text: 'Informiert die Firma über den verantwortungsvollen Konsum ihrer Produkte?' },
        { section: 'ÖKONOMIE', text: 'Investiert die Firma in die Forschung, um ihre Produkte nachhaltiger zu gestalten?' },
        { section: 'ÖKONOMIE', text: 'Nutzt die Firma Nachhaltigkeitslabel?' },
        { section: 'ÖKONOMIE', text: 'Werden erneuerbare Energien für die Produktion genutzt? (>50%)' },
        { section: 'ÖKONOMIE', text: 'Werden Aspekte der Nachhaltigkeit auf allen Etappen der Lieferkette angewendet und kontrolliert?' },
        { section: 'ÖKONOMIE', text: 'Unterstützt das Unternehmen nachhaltige Projekte?' },
        { section: 'ÖKONOMIE', text: 'Wird bei der Auswahl der Materialien und Bestandteile des Produktes darauf geachtet, dass diese einfach reparierbar und recycelbar sind?' },
        { section: 'ÖKONOMIE', text: 'Wird bei der Entwicklung von Produkten ein Life Cycle Assessment angewendet?' },
        { section: 'ÖKONOMIE', text: 'Werden Informationen für die Öffentlichkeit zu Themen der Nachhaltigkeit transparent zur Verfügung gestellt?' },
        { section: 'ÖKONOMIE', text: 'Gibt es ein regelmäßiges Monitoring und eine Weiterentwicklung der Nachhaltigkeitsstrategie des Unternehmens?' },
        { section: 'ÖKONOMIE', text: 'Hat das Unternehmen eine Nachhaltigkeitsstrategie mit konkreten Zielen?' }
    ];

    let currentQuestion = 0;
    const answers = Array(questions.length).fill(null);

    const sectionTitle = document.getElementById('section-title');
    const questionText = document.getElementById('question-text');
    const options = document.getElementById('options');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const formContainer = document.getElementById('form-container');
    const resultContainer = document.getElementById('result-container');
    const scoreText = document.getElementById('score-text');
    const needle = document.getElementById('needle');

    function showQuestion(index) {
        formContainer.classList.remove('show');
        setTimeout(() => {
            sectionTitle.textContent = questions[index].section;
            questionText.textContent = questions[index].text;
            const saved = answers[index];
            document.querySelectorAll('input[name="answer"]').forEach(radio => {
                radio.checked = parseInt(radio.value) === saved;
            });
            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === questions.length - 1 ? 'Abschließen' : 'Weiter';
            formContainer.classList.add('show');
        }, 100);
    }

    function getScore() {
        return answers.reduce((acc, val) => acc + (val ?? 0), 0);
    }

    function getRating(score) {
        const max = questions.length;
        if (score <= 0) return { color: 'red', text: 'sehr schlecht' };
        else if (score <= 10) return { color: 'orange', text: 'schlecht' };
        else if (score <= 20) return { color: 'yellow', text: 'mittel' };
        else if (score <= 30) return { color: 'lightgreen', text: 'gut' };
        else return { color: 'green', text: 'exzellent' };
    }

    nextBtn.addEventListener('click', () => {
        const selected = document.querySelector('input[name="answer"]:checked');
        if (selected) {
            answers[currentQuestion] = parseInt(selected.value);
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                showQuestion(currentQuestion);
            } else {
                showResult();
            }
        } else {
            alert('Bitte eine Option auswählen.');
        }
    });

    prevBtn.addEventListener('click', () => {
        if (currentQuestion > 0) {
            currentQuestion--;
            showQuestion(currentQuestion);
        }
    });

    function showResult() {
        const score = getScore();
        const rating = getRating(score);
        formContainer.style.display = 'none';
        resultContainer.style.display = 'block';
        resultContainer.classList.add('show');
        scoreText.textContent = `Score: ${score} Punkte – Bewertung: ${rating.text}`;
        scoreText.style.color = rating.color;
        const angle = Math.max(0, Math.min(180, (score / questions.length) * 180));
        needle.style.transform = `rotate(${angle}deg)`;
    }

    showQuestion(currentQuestion);
</script>
</body>
</html>
