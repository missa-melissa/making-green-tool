<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nachhaltigkeitsfragebogen</title>
    <style>
        :root {
            --bg-color: #FCF6DE;
            --accent-color: #ADCA78;
            --text-color: #333;
            --button-hover: #9BB96B;
            --beige: #EDE5C7;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100%;
            overflow-x: hidden;
        }

        body {
            background-image: url('background.jpg');
            background-repeat: repeat-x;
            background-position: bottom;
            background-size: auto 50vh;
            background-attachment: fixed;
        }

        #app {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            background-color: rgba(252, 246, 222, 0.95);
            box-sizing: border-box;
        }

        h1, h2 {
            color: var(--accent-color);
            text-align: center;
        }

        p {
            line-height: 1.6;
        }

        .fade {
            opacity: 0;
            transition: opacity 0.5s;
        }

        .fade.show {
            opacity: 1;
        }

        .button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            margin: 1rem 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .button:hover {
            background-color: var(--button-hover);
        }

        .options {
            display: flex;
            flex-direction: column;
            margin: 1rem 0;
        }

        .options label {
            margin: 0.5rem 0;
            padding: 0.5rem;
            background-color: var(--beige);
            border-radius: 4px;
            cursor: pointer;
        }

        .progress-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 300px;
            pointer-events: none;
        }

        #boot {
            width: 300px;
            position: absolute;
            bottom: 0;
            transition: left 0.8s ease;
            z-index: 10;
        }

        .plant-container {
            position: absolute;
            bottom: 0;
            transition: left 0.8s ease;
            width: 100px;
            height: 200px;
            pointer-events: none;
            z-index: 5;
        }

        .plant {
            width: 100%;
            display: block;
        }

        .fire {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: none;
        }

        .result-gauge {
            width: 300px;
            height: 150px;
            margin: 2rem auto;
            position: relative;
            background: var(--beige);
            border-radius: 150px 150px 0 0;
            overflow: hidden;
        }

        .needle {
            width: 4px;
            height: 80%;
            background: var(--accent-color);
            position: absolute;
            bottom: 0;
            left: 50%;
            transform-origin: bottom center;
            transition: transform 1s ease;
        }

        .result-text {
            text-align: center;
            margin-top: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            #boot {
                width: 200px;
            }
            .plant-container {
                width: 70px;
                height: 70px;
            }
            .result-gauge {
                width: 200px;
                height: 100px;
            }
        }

        @media (max-width: 1199px) {
            .progress-container {
                display: none;
            }
        }
    </style>
</head>
<body>
<div id="app">
    <div id="content" class="fade show"></div>
</div>
<div class="progress-container">
    <img id="boot" src="boot.png" alt="Boot">
    <div id="plant-container-oekologie" class="plant-container">
        <img class="plant" id="plant-oekologie" src="plant1_blooms.png" alt="Pflanze Ökologie">
        <img class="fire" id="fire-oekologie" src="fire.png" alt="Feuer">
    </div>
    <div id="plant-container-soziales" class="plant-container">
        <img class="plant" id="plant-soziales" src="plant2_blooms.PNG" alt="Pflanze Soziales">
        <img class="fire" id="fire-soziales" src="fire.png" alt="Feuer">
    </div>
    <div id="plant-container-oekonomie" class="plant-container">
        <img class="plant" id="plant-oekonomie" src="plant3_blooms.PNG" alt="Pflanze Ökonomie">
        <img class="fire" id="fire-oekonomie" src="fire.png" alt="Feuer">
    </div>
</div>
<script>
    const content = document.getElementById('content');
    const boot = document.getElementById('boot');
    let sectionEndIndices = {};

    const plantContainers = {
        Ökologie: document.getElementById('plant-container-oekologie'),
        Soziales: document.getElementById('plant-container-soziales'),
        Ökonomie: document.getElementById('plant-container-oekonomie')
    };

    const plantImages = {
        Ökologie: document.getElementById('plant-oekologie'),
        Soziales: document.getElementById('plant-soziales'),
        Ökonomie: document.getElementById('plant-oekonomie')
    };

    const fires = {
        Ökologie: document.getElementById('fire-oekologie'),
        Soziales: document.getElementById('fire-soziales'),
        Ökonomie: document.getElementById('fire-oekonomie')
    };

    // === Fragen-Platzhalter ===
    const sections = [
        {
            name: 'Ökologie',
            questions: [
                'Es werden keine Tierversuche durgeführt.',
                'Werden nachwachsende Rohstoffe verwendet?',
                'Das Produkt verursacht keine Bodendegradierung.',
                'Das Produkt führt zu keiner regionalen Austrocknung.',
                'Das Produkt verursacht keine Umweltbelastung während der Nutzungsphase.',
                'Die Herstellung des Produkts trägt nicht zur Luftverschmutzung bei.',
                'Es werden keine giftigen oder gefährlichen Stoffe über Wasser verbreitet.',
                'Das Abwasser wird nicht in Gewässer eingeleitet.',
                'Ist der Abfall biologisch abbaubar?',
                'Werden ernsthafte Maßnahmen zur Reduzierung der allgemeinen Umweltbelastung getroffen?',
                'Stammt das Produkt aus ökologischem Anbau?',
                'Das Unternehmen beteiligt sich nicht an der Abholzung von Wäldern.',
                'Das Produkt beeinträchtigt die biologische Vielfalt nicht.',
                'Besteht die Verpackung aus recycelten oder wiederverwendeten Materialien oder kann sie anderweitig genutzt werden, statt weggeworfen zu werden?',
                'Ist die Lieferkette optimiert, um Transportwege zu verkürzen?'
            ]
        },
        {
            name: 'Soziales',
            questions: [
                'Werden entlang der gesamten Lieferkette existenzsichernde Löhne gezahlt?',
                'Werden alle Mitarbeitenden gleich entlohnt – unabhängig von Geschlecht, Alter oder Herkunft?',
                'Es kommt entlang der Lieferkette zu keiner Kinderarbeit.',
                'Es gab in der Vergangenheit keine dokumentierten Fälle von Kinderarbeit entlang der Lieferkette.',
                'Erfahren Mitarbeitende bei psychischen und physischen Problemen Unterstützung durch das Unternehmen?',
                'Werden Beschäftigte in Entscheidungen einbezogen (z. B. über Betriebsräte)?',
                'Gibt es eine Serviceanlaufstelle für Konsument*innen?',
                'Werden sichere Arbeitsbedingungen entlang der gesamten Lieferkette gewährleistet?',
                'Sind Gewerkschaften erlaubt und steht es den Mitarbeitenden frei, sich in diesen zu engagieren und beizutreten?',
                'Gibt es eine Richtlinie zur Achtung der Menschenrechte?',
                'Gibt es entlang der Lieferkette einen Kündigungsschutz für Arbeitnehmer*innen?',
                'Gibt es entlang der Lieferkette verhältnismäßige Arbeitsbedingungen im Bezug auf Maximalarbeitszeit und Überstunden?',
                'Kam es in der Vergangenheit zu Menschenrechtsverletzungen im Umgang mit Mitarbeitenden?',
                'Gibt es entlang der Lieferkette faire arbeitsrechtliche Bestimmungen (Urlaub, Krankheit, Mutterschutz etc.)?',
                'Besteht eine interne Beschwerdestelle für Menschenrechtsverletzungen sowie Diskriminierung?',
                'Werden in Produktionsländern lokale Initiativen und Bewegungen einbezogen?'
            ]
        },
        {
            name: 'Ökonomie',
            questions: [
                'Informiert und sensibilisiert das Unternehmen ihre Kund*innen zu Umweltthemen?',
                'Werden die unterschiedlichen Etappen der Lieferkette so gewählt, dass möglichst nachhaltig und effizient produziert werden kann?',
                'Es wird kein Greenwashing betrieben.',
                'Informiert die Firma über den verantwortungsvollen Konsum ihrer Produkte?',
                'Investiert die Firma in die Forschung, um ihre Produkte nachhaltiger zu gestalten?',
                'Nutzt die Firma Nachhaltigkeitslabel?',
                'Werden erneuerbare Energien für die Produktion genutzt? (>50%)',
                'Werden Aspekte der Nachhaltigkeit auf allen Etappen der Lieferkette angewendet und kontrolliert?',
                'Unterstützt das Unternehmen nachhaltige Projekte?',
                'Wird bei der Auswahl der Materialien und Bestandteile des Produktes darauf geachtet, dass diese einfach reparierbar und recycelbar sind?',
                'Wird bei der Entwicklung von Produkten ein Life Cycle Assessment angewendet?',
                'Werden Informationen für die Öffentlichkeit zu Themen der Nachhaltigkeit transparent zur Verfügung gestellt?',
                'Gibt es ein regelmäßiges Monitoring und eine Weiterentwicklung der Nachhaltigkeitsstrategie des Unternehmens?',
                'Hat das Unternehmen eine Nachhaltigkeitsstrategie mit konkreten Zielen?'
            ]
        }
    ];

    let currentStep = 0;
    let answers = [];
    let screens = [];
    let fazitIndices = {};
    let plantPositions = {};

    // === Screens aufbauen ===
    function buildScreens() {
        screens.push({ type: 'intro' });
        sections.forEach((section, idx) => {
            section.questions.forEach(q => screens.push({ type: 'question', section: section.name, text: q }));
            screens.push({ type: 'fazit', section: section.name });
        });
        screens.push({ type: 'result' });
    }

    function findFazitIndices() {
        sections.forEach(section => {
            const idx = screens.findIndex(s => s.type === 'fazit' && s.section === section.name);
            fazitIndices[section.name] = idx;
        });
    }

    buildScreens();
    findFazitIndices();
    findSectionEndIndices();

    window.addEventListener('load', () => {
        for (let section of sections) {
            calculatePlantPosition(section.name, fazitIndices[section.name]);
        }
    });

    function calculatePlantPosition(sectionName, stepIndex) {
        const total = screens.length - 1;
        const progress = Math.min(1, Math.max(0, stepIndex / total));
        const containerWidth = document.querySelector('.progress-container').offsetWidth;
        const plantWidth = plantContainers[sectionName].offsetWidth;
        plantPositions[sectionName] = progress * (containerWidth - plantWidth) + 40;
        plantContainers[sectionName].style.left = plantPositions[sectionName] + 'px';
    }

    function render() {
        content.classList.remove('show');
        setTimeout(() => {
            content.innerHTML = '';
            const screen = screens[currentStep];

            // === Pflanzenbilder und Feuer pro Pflanze ===
            sections.forEach((section, idx) => {
                const name = section.name;
                let img;
                if (currentStep <= sectionEndIndices[name]) {
                    img = `plant${idx+1}_blooms.png`;
                } else {
                    img = `plant${idx+1}_died.PNG`;
                }
                plantImages[name].src = img;

                // Feuer nur beim eigenen Fazit
                if (screen.type === 'fazit' && screen.section === name) {
                    fires[name].style.display = 'block';
                } else {
                    fires[name].style.display = 'none';
                }
            });

            // === Screens ===
            if (screen.type === 'intro') {
                content.innerHTML = `
          <h1>Willkommen zum Nachhaltigkeitsfragebogen</h1>
          <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit...</p>
          <button class="button" id="start">Start</button>
        `;
                document.getElementById('start').onclick = () => next();
            }
            else if (screen.type === 'question') {
                content.innerHTML = `
          <h2>${screen.section}</h2>
          <p>${screen.text}</p>
          <div class="options">
            <label><input type="radio" name="answer" value="1"> Ja</label>
            <label><input type="radio" name="answer" value="-1"> Nein</label>
            <label><input type="radio" name="answer" value="0"> Keine Aussage</label>
          </div>
          <div>
            ${currentStep > 0 ? '<button class="button" id="back">Zurück</button>' : ''}
            <button class="button" id="next">Weiter</button>
          </div>
        `;
                document.getElementById('next').onclick = () => {
                    const val = document.querySelector('input[name="answer"]:checked');
                    if (val) {
                        answers[currentStep] = parseInt(val.value);
                        next();
                    } else {
                        alert('Bitte eine Option wählen.');
                    }
                };
                if (document.getElementById('back'))
                    document.getElementById('back').onclick = () => back();
            }
            else if (screen.type === 'fazit') {
                content.innerHTML = `
          <h2>Zwischenfazit – ${screen.section}</h2>
          <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit...</p>
          <button class="button" id="next">Weiter</button>
        `;
                document.getElementById('next').onclick = () => next();
            }
            else if (screen.type === 'result') {
                const score = answers.reduce((a, b) => a + (b || 0), 0);
                const maxScore = answers.length;
                let rating = '';
                let color = '';
                if (score <= 0) { rating = 'sehr schlecht'; color = 'red'; }
                else if (score <= 10) { rating = 'schlecht'; color = 'orange'; }
                else if (score <= 20) { rating = 'mittel'; color = 'yellow'; }
                else if (score <= 30) { rating = 'gut'; color = '#ADCA78'; }
                else { rating = 'exzellent'; color = 'green'; }

                const degree = Math.min(180, Math.max(0, score / maxScore * 180));
                content.innerHTML = `
          <h1>Ergebnis</h1>
          <div class="result-gauge">
            <div class="needle" id="needle"></div>
          </div>
          <div class="result-text" style="color:${color}">Score: ${score} Punkte – Bewertung: ${rating}</div>
        `;
                setTimeout(() => {
                    document.getElementById('needle').style.transform = 'rotate(' + degree + 'deg)';
                }, 100);
            }

            content.classList.add('show');
            updateBootPosition();
        }, 100);
    }

    function updateBootPosition() {
        const total = screens.length - 1;
        const progress = Math.min(1, Math.max(0, currentStep / total));
        const containerWidth = document.querySelector('.progress-container').offsetWidth;
        const bootWidth = boot.offsetWidth;
        const left = progress * (containerWidth - bootWidth);
        boot.style.left = left + 'px';

        // Pflanzen bleiben fix an ihren Positionen
        for (let section of sections) {
            plantContainers[section.name].style.left = plantPositions[section.name] + 'px';
        }
    }

    function findSectionEndIndices() {
        sections.forEach((section, idx) => {
            let lastIndex;
            if (idx < sections.length - 1) {
                lastIndex = screens.findIndex(s => s.type === 'fazit' && s.section === section.name);
            } else {
                lastIndex = screens.length - 2; // letzter Fragen-Screen vor Ergebnis
            }
            sectionEndIndices[section.name] = lastIndex;
        });
    }


    function next() {
        if (currentStep < screens.length - 1) {
            currentStep++;
            render();
        }
    }

    function back() {
        if (currentStep > 0) {
            currentStep--;
            render();
        }
    }

    window.addEventListener('resize', () => {
        for (let section of sections) {
            calculatePlantPosition(section.name, fazitIndices[section.name]);
        }
        updateBootPosition();
    });

    render();
</script>
</body>
</html>
